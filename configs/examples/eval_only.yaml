name: eval-only-qwen3-4b
model: Qwen/Qwen3-4B
chat_template: qwen_thinker

mix:
  - dataset: mnoukhov/aime_2025_openinstruct
    proportion: 1.0
    split: train

eval_mix:
  - dataset: mnoukhov/aime_2025_openinstruct
    num_samples: 16
    split: train
  - dataset: mnoukhov/brumo_2025_openinstruct
    num_samples: 16
    split: train
  - dataset: davidheineman/eval-openinstruct
    split: gpqa
    num_samples: 128
  - dataset: davidheineman/eval-openinstruct
    split: ifeval
    num_samples: 128
  - dataset: davidheineman/eval-openinstruct
    split: mmlu
    num_samples: 128
  - dataset: davidheineman/eval-openinstruct
    split: humanevalplus
    num_samples: 128
  - dataset: davidheineman/eval-openinstruct
    split: mbppplus
    num_samples: 128
  - dataset: davidheineman/eval-openinstruct
    split: livecodebench
    num_samples: 128
  - dataset: davidheineman/eval-openinstruct
    split: ifeval_ood
    num_samples: 128

training:
  total_episodes: 16
  local_eval_every: 1
  deepspeed_stage: 3
  response_length: 32256
  max_prompt_token_length: 512
  pack_length: 32768
  num_samples_per_prompt_rollout: 2
  num_unique_prompts_rollout: 8

infra:
  num_learners_per_node: 4
  vllm_num_engines: 4
  vllm_tensor_parallel_size: 1

beaker:
  cluster: ai2/jupiter
  workspace: ai2/adaptability
  budget: ai2/oe-base
  gpus: 8
  priority: urgent
  image: michaeln/open_instruct
  setup_commands:
    - uv pip install --no-deps datasets==4.8.4
    - git clone --depth 1 -b dhei/rl-mixing https://github.com/allenai/open-instruct.git /tmp/oi && cp /tmp/oi/open_instruct/ground_truth_utils.py /tmp/oi/open_instruct/IFEvalG/instructions.py /tmp/oi/open_instruct/IFEvalG/instructions_registry.py /tmp/oi/open_instruct/IFEvalG/instructions_util.py open_instruct/ open_instruct/IFEvalG/ 2>/dev/null; cp /tmp/oi/open_instruct/IFEvalG/* open_instruct/IFEvalG/ 2>/dev/null || true
    - uv pip install nltk spacy emoji syllapy langdetect -q 2>/dev/null || true
    - python -c "import nltk; nltk.download('punkt_tab', quiet=True); nltk.download('stopwords', quiet=True); nltk.download('averaged_perceptron_tagger_eng', quiet=True)"
    - python -c "p=__import__('transformers').__file__.replace('__init__.py','modeling_rope_utils.py');t=open(p).read().replace('received_keys -= ignore_keys','received_keys -= set(ignore_keys)');open(p,'w').write(t)"
    - python -c "p=__import__('transformers').__file__.replace('__init__.py','modeling_utils.py');t=open(p).read().replace('model = cls(config, *model_args, **model_kwargs)','model_kwargs.pop(\"use_cache\", None); model = cls(config, *model_args, **model_kwargs)');open(p,'w').write(t)"
    - echo  | base64 -d | python
  env:
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    VLLM_ATTENTION_BACKEND: FLASH_ATTN

extra_args:
  eval_on_step_0: true
  save_traces: true
  stop_strings: "</answer>"
  code_api_url: "https://p9f1719l7f.execute-api.us-west-2.amazonaws.com/prod/test_program"
  code_max_execution_time: 6.0
  wandb_project: rl-mixing
