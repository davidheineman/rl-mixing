# RLVR with Qwen2.5-1.5B-Instruct (small/fast for iteration)
# Based on working config from allenai/open-instruct qwen3_4b_dapo_math_32k.sh
# Launch: python launch.py configs/examples/gsm_math_qwen_2b.yaml

name: gsm-math-qwen2.5-1.5b-inst-100k
model: Qwen/Qwen2.5-1.5B-Instruct
chat_template: null

mix:
  - dataset: allenai/RLVR-GSM-MATH-IF-Mixed-Constraints
    proportion: 1.0
    split: train

eval_mix:
  - dataset: allenai/RLVR-GSM-MATH-IF-Mixed-Constraints
    num_samples: 16
    split: train

training:
  learning_rate: 1.0e-6
  beta: 0.0
  total_episodes: 100000
  temperature: 1.0
  response_length: 2048
  max_prompt_token_length: 2048
  pack_length: 4096
  num_samples_per_prompt_rollout: 16
  num_unique_prompts_rollout: 8
  async_steps: 4
  per_device_train_batch_size: 1
  kl_estimator: 3
  lr_scheduler_type: constant
  deepspeed_stage: 3
  gradient_checkpointing: true
  seed: 1
  local_eval_every: 50
  save_freq: 50
  non_stop_penalty: false
  apply_verifiable_reward: true

infra:
  # 1 node, 8 GPUs: 4 learner + 4 vLLM engines (recommended for small models)
  num_learners_per_node: 4
  vllm_tensor_parallel_size: 1
  vllm_num_engines: 4

beaker:
  cluster: ai2/jupiter
  workspace: ai2/adaptability
  budget: ai2/oe-adapt
  num_nodes: 1
  gpus: 8
  priority: urgent
  preemptible: true
  image: nathanl/open_instruct_auto

extra_args:
  - --system_prompt_override_file
  - scripts/train/qwen/math_system_prompt.txt
  - --active_sampling
  - --inflight_updates
  - --vllm_enable_prefix_caching
  - --load_ref_policy
  - "True"
