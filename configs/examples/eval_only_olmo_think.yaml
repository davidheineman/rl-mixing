name: eval-only-olmo3-7b-think
model: allenai/Olmo-3-7B-Think
chat_template: olmo_thinker

mix:
  - dataset: mnoukhov/aime_2025_openinstruct
    proportion: 1.0
    split: train

eval_mix:
  - dataset: mnoukhov/aime_2025_openinstruct
    num_samples: 16
    split: train
  - dataset: mnoukhov/brumo_2025_openinstruct
    num_samples: 16
    split: train
  - dataset: davidheineman/eval-openinstruct
    split: gpqa
    num_samples: 16
  - dataset: davidheineman/eval-openinstruct
    split: ifeval
    num_samples: 16
  - dataset: davidheineman/eval-openinstruct
    split: mmlu
    num_samples: 16
  - dataset: davidheineman/eval-openinstruct
    split: humanevalplus
    num_samples: 16
  - dataset: davidheineman/eval-openinstruct
    split: mbppplus
    num_samples: 16
  - dataset: davidheineman/eval-openinstruct
    split: livecodebench
    num_samples: 16
  - dataset: davidheineman/eval-openinstruct
    split: ifeval_ood
    num_samples: 16

training:
  total_episodes: 256
  local_eval_every: 1
  deepspeed_stage: 3
  response_length: 512
  max_prompt_token_length: 512
  num_samples_per_prompt_rollout: 1
  num_unique_prompts_rollout: 16

infra:
  num_learners_per_node: 4
  vllm_num_engines: 4
  vllm_tensor_parallel_size: 1

beaker:
  cluster: ai2/jupiter
  workspace: ai2/adaptability
  budget: ai2/oe-base
  gpus: 8
  priority: urgent
  image: michaeln/open_instruct
  setup_commands:
    - uv pip install --no-deps datasets==4.8.4
    - uv pip install --no-deps "transformers>=4.57.0"
    - python -c "p=__import__('transformers').__file__.replace('__init__.py','modeling_utils.py');t=open(p).read().replace('model = cls(config, *model_args, **model_kwargs)','model_kwargs.pop(\"use_cache\", None); model = cls(config, *model_args, **model_kwargs)');open(p,'w').write(t)"
  env:
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    VLLM_ATTENTION_BACKEND: FLASH_ATTN

extra_args:
  filter_zero_std_samples: "False"
  stop_strings: "</answer>"
  wandb_project: rl-mixing
