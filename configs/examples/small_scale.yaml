# Based on
  # https://github.com/allenai/open-instruct/blob/main/scripts/train/qwen/qwen3_4b_dapo_math_32k.sh
  # https://beaker.org/orgs/ai2/workspaces/oe-adapt-code/work/01KNJ0CTMABCW4NX3SCH33MMEB

name: debug-nvidia-mix-qwen3-1.7b
model: Qwen/Qwen3-1.7B-Base
chat_template: qwen_thinker

mix:
  # more useful domains
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0136
    split: dapo_math
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0544
    split: skywork_math
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0068
    split: math_proofs
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0136
    split: multiturn_chat
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0272
    split: reasoning_gym
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.1224
    split: competitive_coding
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0272
    split: structured_outputs
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.1224
    split: instruction_following
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0408
    split: mcqa
  # less useful domains
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.2721
    split: agentic_tool_use
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0408
    split: swe_pivot
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0136
    split: identity_following
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0272
    split: calendar
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0272
    split: safety
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.0136
    split: workplace_assistant
  - dataset: davidheineman/nemotron-super-stage-1-unmixed-openinstruct
    proportion: 0.1769
    split: genrm

eval_mix:
  - dataset: mnoukhov/aime_2025_openinstruct
    num_samples: 32
    split: train
  - dataset: mnoukhov/brumo_2025_openinstruct
    num_samples: 32
    split: train
  - dataset: davidheineman/eval-openinstruct
    split: gpqa
    num_samples: 32
  - dataset: davidheineman/eval-openinstruct
    split: ifeval
    num_samples: 32
  - dataset: davidheineman/eval-openinstruct
    split: mmlu
    num_samples: 32
  - dataset: davidheineman/eval-openinstruct
    split: humanevalplus
    num_samples: 32
  - dataset: davidheineman/eval-openinstruct
    split: mbppplus
    num_samples: 32
  - dataset: davidheineman/eval-openinstruct
    split: livecodebench
    num_samples: 32
  - dataset: davidheineman/eval-openinstruct
    split: ifeval_ood
    num_samples: 32

training:
  learning_rate: 1.0e-6
  beta: 0.0
  total_episodes: 131072 # total completions (# train steps * # unique prompts * # rollouts per prompt)
  temperature: 1.0
  ## 32K rollouts
  # response_length: 32256
  # max_prompt_token_length: 512
  # pack_length: 32768
  ## 8K rollouts
  response_length: 6144
  max_prompt_token_length: 2048
  pack_length: 8192
  num_samples_per_prompt_rollout: 16
  num_unique_prompts_rollout: 8 # num distinct prompts per train step
  async_steps: 1
  per_device_train_batch_size: 1
  kl_estimator: 2
  lr_scheduler_type: constant
  deepspeed_stage: 3
  gradient_checkpointing: true
  seed: 1
  local_eval_every: 100
  save_freq: 100
  non_stop_penalty: false
  apply_verifiable_reward: true

infra:
  num_learners_per_node: 4
  vllm_num_engines: 4
  vllm_tensor_parallel_size: 1

beaker:
  cluster: ai2/jupiter
  workspace: ai2/adaptability
  budget: ai2/oe-adapt
  num_nodes: 1
  gpus: 8
  priority: urgent
  preemptible: true
  image: michaeln/open_instruct
  setup_commands:
    # Pull nemo verifiers from our branch
    - git clone --depth 1 -b dhei/rl-mixing https://github.com/allenai/open-instruct.git /tmp/oi && cp /tmp/oi/open_instruct/nemo_verifiers.py /tmp/oi/open_instruct/ground_truth_utils.py /tmp/oi/open_instruct/grpo_fast.py /tmp/oi/open_instruct/data_loader.py /tmp/oi/open_instruct/dataset_transformation.py /tmp/oi/open_instruct/model_utils.py open_instruct/ && uv pip install openapi-schema-validator pyyaml xmltodict spacy langdetect emoji syllapy nltk -q 2>/dev/null || true && python -m nltk.downloader stopwords -q 2>/dev/null || true
  env:
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    VLLM_ATTENTION_BACKEND: FLASH_ATTN

extra_args:
  # active_sampling: true  # prioritize prompts with low, but non-zero, correctness
  inflight_updates: true
  vllm_enable_prefix_caching: true
  clip_higher: 0.272
  mask_truncated_completions: "False"
  load_ref_policy: "True"
  num_mini_batches: 1
  stop_strings: "</answer>"
  code_api_url: "https://p9f1719l7f.execute-api.us-west-2.amazonaws.com/prod/test_program"
  code_max_execution_time: 6.0
  checkpoint_state_freq: 100
  checkpoint_state_dir: /weka/oe-adapt-default/allennlp/deletable_checkpoint/davidh/
  wandb_project: rl-mixing
